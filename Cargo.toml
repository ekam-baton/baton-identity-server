[package]
name = "baton-identity-server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "uuid", "chrono", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
lettre = { version = "0.11.7", features = ["tokio1", "tokio1-native-tls", "builder", "smtp-transport"] }
dashmap = "6.0.1"
hex = "0.4.3"
tower-http = { version = "0.6.2", features = ["cors"] }
anyhow = "1.0.104"
reqwest = { version = "0.13.4", features = ["json"] }
